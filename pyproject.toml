[project]
name = "ai-travel-planner"
version = "0.1.0"
description = "AI-powered personal travel planning assistant"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
